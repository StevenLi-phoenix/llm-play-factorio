[mod-name]
factorio-mcp=Factorio MCP

[mod-description]
factorio-mcp=Game side of factorio-mcp: AI agents each control one character over RCON, using only normal player mechanics.

[mod-setting-name]
factorio-mcp-max-characters=Max agent characters
factorio-mcp-chart-radius=Agent exploration radius (chunks)
factorio-mcp-view-radius=Agent view radius (tiles)
factorio-mcp-explore-radius=Max walk into unexplored land (tiles)
factorio-mcp-start-area=Starting map area around spawn (tiles)
factorio-mcp-pathfinder-budget=Pathfinder work per tick (× vanilla)
factorio-mcp-enforce-blueprint-provenance=Only allow blueprints made during the run
factorio-mcp-rpc-log=Log every RPC for replay
factorio-mcp-humans-spectate=Humans only spectate
factorio-mcp-archive-minutes=Archive the save every N minutes (0 = off)

[mod-setting-description]
factorio-mcp-max-characters=How many agent characters may exist at once.
factorio-mcp-chart-radius=Chunks around each agent character that count as explored (2 = 5x5 chunks, like a player).
factorio-mcp-view-radius=Distance within which agents see live details of other forces (enemies).
factorio-mcp-explore-radius=How far past explored ground a walk goal may be.
factorio-mcp-pathfinder-budget=The engine pathfinder expands 1000 nodes per tick by default, shared by every character and biter; several agents asking for long paths at once then wait many seconds. This multiplies the per-tick budget (1 = vanilla). Changes map settings.
factorio-mcp-enforce-blueprint-provenance=On: import_blueprint and build_blueprint refuse export strings that were not exported from the map (export_blueprint) or registered by the harness (register_blueprint), so no blueprint from before the run can be used. Blueprints a character carries are not affected. Turn off for sandbox and test servers.
factorio-mcp-rpc-log=On: every RPC the MCP servers send is appended, before it runs, to script-output/rpc-log/<run id>.jsonl on the server (tick, method, character, params), for deterministic replay.
factorio-mcp-humans-spectate=On: a player who joins, or is connected when this is turned on, gets the spectator controller (cannot build, mine or craft) and their character is destroyed so it is not an item source. Agent characters are not touched.
factorio-mcp-archive-minutes=Every N minutes of game time the server writes saves/archive-<tick>.zip, which nothing overwrites, so the run keeps its whole history. 0 turns it off.
factorio-mcp-start-area=Agents start knowing this many tiles around the spawn point, like the area freeplay charts for a new player (0 = off).
