# Local Factorio 2.0 base-game server for LLM agent runs.
# Runtime state lives in ../runtime/factorio (gitignored); scripts/new_run.sh resets it.
name: llm-factorio

services:
  factorio:
    image: factoriotools/factorio:2.0.77   # pinned: `stable` moves, `latest` is 2.1 experimental
    container_name: llm-factorio
    environment:
      DLC_SPACE_AGE: "false"               # image default is true; disables space-age/quality/elevated-rails
      GENERATE_NEW_SAVE: "true"            # only generates when saves/$SAVE_NAME.zip is absent
      SAVE_NAME: run
      LOAD_LATEST_SAVE: "false"
    ports:
      - "34197:34197/udp"                  # game (user's client joins here)
      - "127.0.0.1:27015:27015/tcp"        # RCON, localhost only
    volumes:
      - ../runtime/factorio:/factorio
      - ../factorio-mcp/mod/factorio-mcp:/factorio/mods/factorio-mcp:ro
    restart: "no"
    stop_grace_period: 30s
